# ============================================================
# CD Pipeline — Deploy on merge to main
# ============================================================
# Builds Docker image, pushes to registry, and deploys.
# Customize the deploy step for your hosting (Railway, Vercel, AWS, etc.)
# ============================================================

name: CD

on:
  push:
    branches: [main]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: "20"
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/backend

jobs:
  # ---- Run CI first ----
  ci:
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  # ---- Build and push Docker image ----
  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: [ci]
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # ---- Deploy (customize per hosting provider) ----
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: [build-and-push]
    environment: production

    steps:
      - uses: actions/checkout@v4

      # Example: Railway deployment
      # Uncomment and configure for your provider
      #
      # - name: Deploy to Railway
      #   uses: bervProject/railway-deploy@main
      #   with:
      #     railway_token: ${{ secrets.RAILWAY_TOKEN }}
      #     service: backend

      - name: Deployment placeholder
        run: |
          echo "✅ Docker image pushed to ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          echo "Configure this step for your hosting provider (Railway, AWS ECS, etc.)"
